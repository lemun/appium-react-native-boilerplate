name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      android-e2e:
        description: Also run the E2E suite on an Android emulator
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Typecheck, lint, format, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run validate

  android-e2e:
    name: E2E on Android emulator (manual)
    if: github.event_name == 'workflow_dispatch' && inputs.android-e2e
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      API_LEVEL: 35
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Cache demo app
        uses: actions/cache@v6
        with:
          path: apps
          key: demo-app-${{ hashFiles('src/config/demoApp.ts') }}
      - run: npm run app:download -- android

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run E2E suite
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: pixel_7
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: npm run android

      - name: Upload logs and Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-e2e-results
          path: |
            logs/
            allure-results/
          if-no-files-found: ignore
