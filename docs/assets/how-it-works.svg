<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title desc"><title id="title">How Appium React Native Boilerplate works</title><desc id="desc">TypeScript specs use screen objects and helpers. The WebdriverIO local runner executes them with Mocha and manages the loopback Appium server. XCUITest drives the demo app on an iOS simulator; UiAutomator2 drives it on an Android emulator or device. The runner emits spec and Allure results, and saves screenshots on test failure. APP_PATH selects a different app binary. This diagram describes the configured architecture, not test pass status.</desc><rect width="1600" height="800" rx="24" fill="#F8FAFC"/><text x="64" y="99" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700" fill="#141923">From test intent to native interaction</text><text x="64" y="148" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="400" fill="#526174">TypeScript specs · WebdriverIO · Appium · iOS and Android</text><rect x="64" y="242" width="330" height="332" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="88" y="288" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#141923">Test code</text><text x="88" y="336" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#9A491A">TypeScript specs</text><text x="88" y="370" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#526174">src/specs/*.spec.ts</text><path d="M88 398H370" fill="none" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="88" y="438" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#141923">Screen objects</text><text x="88" y="476" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#526174">Selectors + actions</text><text x="88" y="516" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#526174">Helpers + UI copy</text><text x="88" y="550" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="400" fill="#526174">src/screenobjects · src/helpers</text><path d="M410 408H448m-11 -7 11 7-11 7" fill="none" stroke="#526174" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="466" y="242" width="302" height="332" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="490" y="288" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700" fill="#141923">WebdriverIO</text><text x="490" y="336" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#9A491A">Local runner + Mocha</text><text x="490" y="382" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#526174">Loads platform config</text><text x="490" y="419" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#526174">Runs the test specs</text><text x="490" y="456" font-family="Arial, Helvetica, sans-serif" font-size="23" font-weight="400" fill="#526174">Starts / stops Appium</text><text x="490" y="550" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="400" fill="#526174">wdio.*.conf.ts</text><path d="M784 408H822m-11 -7 11 7-11 7" fill="none" stroke="#526174" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="840" y="320" width="260" height="176" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="864" y="366" font-family="Arial, Helvetica, sans-serif" font-size="29" font-weight="700" fill="#141923">Appium server</text><text x="864" y="411" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#9A491A">Loopback only</text><text x="864" y="457" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#526174">127.0.0.1</text><path d="M1100 408H1136V313H1172m-11 -7 11 7-11 7" fill="none" stroke="#526174" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M1136 408V512H1172m-11 -7 11 7-11 7" fill="none" stroke="#526174" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="1188" y="242" width="348" height="142" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="1212" y="282" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#9A491A">XCUITest</text><text x="1212" y="322" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#141923">iOS simulator</text><text x="1212" y="358" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#526174">WebdriverIO demo app</text><rect x="1188" y="441" width="348" height="142" rx="16" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2"/><text x="1212" y="481" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" fill="#9A491A">UiAutomator2</text><text x="1212" y="521" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#141923">Android emulator / device</text><text x="1212" y="557" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="400" fill="#526174">WebdriverIO demo app</text><path d="M617 574V619" fill="none" stroke="#526174" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="466" y="620" width="1070" height="65" rx="16" fill="#FFF0E3" stroke="#CBD5E1" stroke-width="2"/><text x="490" y="662" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#9A491A">Run output</text><text x="657" y="662" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#141923">Spec + Allure results · screenshots on test failure</text><path d="M64 718H1536" fill="none" stroke="#CBD5E1" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="64" y="758" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="400" fill="#526174">Default target: the public demo app. Set APP_PATH to use your own binary.</text></svg>
